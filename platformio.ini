; =========================================================================
; PlatformIO Project Configuration
; Project: DESIOT BLE Mesh & MQTT Gateway Irrigation System
; Course : Desain dan Aplikasi IoT - ITS Surabaya
; =========================================================================

[platformio]
default_envs = node1_pump, node2_sensor_lpn, node3_relay_friend, node4_gateway

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCONFIG_BLE_MESH_NODE=1
    -DCONFIG_BLE_MESH_PB_ADV=1
    -DCONFIG_BLE_MESH_RELAY=1
    -DCONFIG_BLE_MESH_FRIEND=1
    -DCONFIG_BLE_MESH_FRIEND_SEG_RX=1
    -DCONFIG_BLE_MESH_FRIEND_SUB_LIST_SIZE=3
    -DCONFIG_BLE_MESH_FRIEND_LPN_COUNT=2
    -DCONFIG_BLE_MESH_LOW_POWER=1
    -DCONFIG_BLE_MESH_LPN_GROUPS=8
    -Wl,--wrap=bt_mesh_subnet_get
    -Wl,--wrap=bt_mesh_model_send
    -Wl,--wrap=bt_mesh_app_key_get
    -Wl,--wrap=bt_mesh_upper_key_get
    -Wl,--wrap=bt_mesh_rx_appkey_get
    -Wl,--wrap=bt_mesh_rx_appkey_size
    -Wl,--wrap=bt_mesh_rx_netkey_get
    -Wl,--wrap=bt_mesh_rx_netkey_size
    -Wl,--wrap=bt_mesh_dev_key_get
    -Wl,--wrap=bt_mesh_rx_devkey_get
    -Wl,--wrap=bt_mesh_rx_devkey_size
    -Wl,--wrap=bt_mesh_rpl_check
    -Iinclude

; -------------------------------------------------------------------------
; NODE 1: Pompa Air DC (Generic OnOff Server)
; -------------------------------------------------------------------------
[env:node1_pump]
build_src_filter = +<node1_pump/*>

; -------------------------------------------------------------------------
; NODE 2: Sensor Kelembapan Tanah (Low Power Node)
; -------------------------------------------------------------------------
[env:node2_sensor_lpn]
build_src_filter = +<node2_sensor_lpn/*>

; -------------------------------------------------------------------------
; NODE 3: Relay + Friend Node (Mesh Backbone)
; -------------------------------------------------------------------------
[env:node3_relay_friend]
build_src_filter = +<node3_relay_friend/*>

; -------------------------------------------------------------------------
; NODE 4: Provisioner + Proxy + Gateway Wi-Fi MQTT
; -------------------------------------------------------------------------
[env:node4_gateway]
build_src_filter = +<node4_gateway/*>
build_flags = 
    ${env.build_flags}
    -DCONFIG_BLE_MESH_PROVISIONER=1
    -DCONFIG_BLE_MESH_PROVISIONER_APP_KEY_COUNT=3
    -DCONFIG_BLE_MESH_PROVISIONER_SUBNET_COUNT=3
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0
